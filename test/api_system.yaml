frames:
  map: "map"
  odom: "odom"
  base: "base_link"
  lidar: "test_lidar"

topics:
  pointcloud: "/phase8_test/points"
  imu: "/phase8_test/imu"
  initial_pose: "/phase8_test/initialpose"
  localization_raw_odometry: "/phase8_test/raw_odometry"
  localization_correction: "/phase8_test/map_to_odom"
  localization_odometry: "/phase8_test/localization_odometry"
  localization_pose: "/phase8_test/localization_pose"
  system_status: "/phase8_test/system_status"

last_pose:
